<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>انضمام للعبة</title>
  <link rel="icon" href="/img/college-logo.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="join">
  <header class="topbar">
    <div class="brand">
      <img src="/img/college-logo.webp" alt="شعار كلية علوم الحاسوب وتكنولوجيا المعلومات - جامعة كربلاء" width="52" height="52">
      <div>انضمام للعبة
        <small>منصة الأسئلة اللحظية</small>
      </div>
    </div>
    <div id="conn" class="conn">جارٍ الاتصال…</div>
  </header>

  <main>
    <section id="loading" class="center">جارٍ الاتصال…</section>

    <form id="joinForm" class="card join-card" hidden>
      <h1>ادخل رمز الغرفة</h1>
      <label>رمز الغرفة (PIN)
        <input id="pinInput" class="pin-input ltr" inputmode="numeric" autocomplete="off"
               maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
      </label>
      <label>اسمك
        <input id="nameInput" maxlength="20" autocomplete="nickname" placeholder="مثلاً: سارة" required>
      </label>
      <button id="joinButton" class="btn primary" type="submit">انضمام</button>
      <p id="joinError" class="error" hidden></p>
    </form>

    <section id="waiting" class="card waiting" hidden>
      <p class="muted">أنت في الغرفة</p>
      <p class="big ltr" id="waitPin"></p>
      <p class="hello">مرحباً <strong id="waitName"></strong></p>
      <div class="spinner" aria-hidden="true"></div>
      <p id="waitStatus">بانتظار المضيف ليبدأ اللعبة…</p>
      <p class="count">عدد اللاعبين في الغرفة: <strong id="waitCount">0</strong></p>
      <button id="leaveButton" class="btn" type="button">مغادرة الغرفة</button>
    </section>
  </main>

  <footer class="site-footer">إعداد وتصميم : <strong>فاطمة عبدالله</strong><span class="sep" aria-hidden="true">•</span>إشراف : <strong>دكتورة وفاء شاكر الربيعي</strong></footer>
  <div class="stripes" aria-hidden="true"></div>
  <script type="module" src="/js/join.js"></script>
</body>
</html>
